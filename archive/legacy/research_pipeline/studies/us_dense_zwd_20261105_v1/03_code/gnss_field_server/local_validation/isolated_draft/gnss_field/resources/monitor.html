<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GNSS训练监控</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#182637;font:15px system-ui,"Microsoft YaHei",sans-serif}
main{max-width:1300px;margin:auto;padding:30px}h1{font-size:26px;margin:0 0 8px}.muted{color:#586b7c}.cards,.plots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:22px 0}
section{background:white;border:1px solid #dce3ea;border-radius:10px;padding:18px}h2{font-size:16px;margin:0 0 12px}svg{width:100%;height:250px}.readout{font-size:22px;font-weight:600}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:10px;border-bottom:1px solid #e1e7ed}select{max-width:100%;padding:8px;background:white;border:1px solid #bbc9d5;border-radius:6px}code{overflow-wrap:anywhere}
@media(max-width:750px){.cards,.plots{grid-template-columns:1fr}main{padding:16px}table{display:block;overflow:auto}}
</style><main><h1>GNSS场训练监控</h1><div class="muted">只读 · 每5秒刷新 · 指标来自实际日志；没有新记录时保留最后更新时间</div>
<div class="cards"><section><h2>运行阶段</h2><div id="state" class="readout">等待日志</div><p id="updated" class="muted">尚无训练数据</p><select id="run" aria-label="选择实验运行"></select></section><section><h2>当前开发产品</h2><table><tr><th>选模产品</th><th>最新指标</th><th>步数</th></tr><tbody id="products"></tbody></table><p class="muted">开发子集与完整2019评价分开记录。工程验收样本不代表最终精度。</p></section></div>
<div class="plots"><section><h2>训练损失（当前模型量纲）</h2><svg id="loss" role="img" aria-label="训练损失曲线"></svg></section><section><h2>开发站宏RMSE（mm）</h2><svg id="point" role="img" aria-label="开发RMSE曲线"></svg></section><section><h2>联合概率ES（mm）</h2><svg id="joint" role="img" aria-label="开发ES曲线"></svg></section><section><h2>边缘概率CRPS（mm）</h2><svg id="marginal" role="img" aria-label="开发CRPS曲线"></svg></section></div>
<section><h2>最后一条训练记录</h2><code id="detail">—</code></section></main>
<script>
const $=x=>document.getElementById(x);let payload=null,selected='';
function chart(id,points,color){const e=$(id),W=560,H=250,L=54,R=15,T=16,B=30;e.setAttribute('viewBox',`0 0 ${W} ${H}`);if(!points.length){e.innerHTML='<text x="30" y="120" fill="#6a7c8c">暂无已记录指标</text>';return}
let xs=points.map(p=>p[0]),ys=points.map(p=>p[1]),a=Math.min(...xs),b=Math.max(...xs),c=Math.min(...ys),d=Math.max(...ys);if(a===b)b=a+1;if(c===d){c-=.01;d+=.01}let X=x=>L+(x-a)/(b-a)*(W-L-R),Y=y=>H-B-(y-c)/(d-c)*(H-T-B),line=points.map(p=>`${X(p[0])},${Y(p[1])}`).join(' ');e.innerHTML=`<path d="M${L},${T}V${H-B}H${W-R}" fill="none" stroke="#c0ccd5"/><text x="${L}" y="${H-7}" fill="#65798a" font-size="11">${a}</text><text x="${W-55}" y="${H-7}" fill="#65798a" font-size="11">${b}步</text><text x="2" y="${T+5}" fill="#65798a" font-size="11">${d.toPrecision(4)}</text><text x="2" y="${H-B}" fill="#65798a" font-size="11">${c.toPrecision(4)}</text><polyline points="${line}" fill="none" stroke="${color}" stroke-width="2"/>`}
function render(){if(!payload)return;let r=payload.runs.find(x=>x.name===selected)||payload.runs.at(-1);if(!r)return;selected=r.name;$('run').value=selected;let s=r.status,t=r.training.at(-1)||{};$('state').textContent=`${s.stage||t.stage||selected} · ${s.status||'未知'} · ${s.step??t.step??0}步`;$('updated').textContent=s.updated?'最后更新：'+new Date(s.updated*1000).toLocaleString():'尚无更新时间';$('detail').textContent=JSON.stringify(t);chart('loss',r.training.filter(x=>Number.isFinite(x.loss)).map(x=>[x.step,x.loss]),'#196a9a');$('products').replaceChildren();for(let k of ['point','joint','marginal']){let p=r.development.filter(x=>!x.startup&&Number.isFinite(x.metrics?.[k]?.value)).map(x=>[x.step,x.metrics[k].value]);chart(k,p,k==='joint'?'#327b55':'#8b5d9d');let row=document.createElement('tr');for(let v of [k==='point'?'点值RMSE':k==='joint'?'联合ES':'边缘CRPS',p.length?p.at(-1)[1].toFixed(4):'—',p.length?p.at(-1)[0]:'—']){let td=document.createElement('td');td.textContent=v;row.append(td)}$('products').append(row)}}
async function refresh(){try{payload=await(await fetch('/api/status',{cache:'no-store'})).json();let existing=selected;$('run').replaceChildren();for(let r of payload.runs){let o=document.createElement('option');o.value=r.name;o.textContent=r.name;$('run').append(o)}selected=existing||payload.runs.at(-1)?.name||'';render()}catch(e){$('updated').textContent='读取失败；保留上次记录：'+e.message}}
$('run').onchange=()=>{selected=$('run').value;render()};refresh();setInterval(refresh,5000);
</script></html>
