<!doctype html><meta charset="utf-8"><title>GNSS 场重建训练</title>
<style>body{font:16px system-ui;background:#101827;color:#dce8f4;margin:32px}h1{font-size:25px}.cards{display:flex;gap:16px;flex-wrap:wrap}.card{background:#1c293c;padding:20px;border-radius:10px;min-width:260px}canvas{width:100%;height:270px;background:#172236;margin:16px 0}table{border-collapse:collapse;width:100%}td,th{padding:10px;border-bottom:1px solid #405069;text-align:left}.note{color:#a5b8d2}select{padding:8px}</style>
<h1>稀疏GNSS · 第一阶段场重建</h1><p class="note">Diffusion / GAN 研究基础阶段 · M0 → M2-F → M2-J · 仅本机读取日志，每5秒刷新</p>
<div id="status"></div><p><select id="arm"><option>M0</option><option>M2-F</option><option>M2-J</option></select></p>
<div class="cards" id="cards"></div><h3>训练损失分项</h3><p class="note">蓝：总损失　绿：均值损失　黄：NLL　紫：曲率；不同训练目标的总loss不可直接排名。</p><canvas id="loss" width="1200" height="300"></canvas>
<h3>2019开发子集站宏RMSE（mm）</h3><p class="note">第200步为启动检查，不参与选模。折线连接实际评价点，不生成中间指标。</p><canvas id="rmse" width="1200" height="300"></canvas>
<h3>完整2019评价（独立于子集曲线）</h3><div id="full"></div><h3>实时日志（最近20条）</h3><pre id="rawlog" style="white-space:pre-wrap;background:#172236;padding:16px;max-height:360px;overflow:auto"></pre><p id="error"></p>
<script>
const $=s=>document.getElementById(s);let state;
function plot(id,series){let c=$(id),g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);let pts=series.flatMap(s=>s.p).filter(p=>Number.isFinite(p[1]));if(!pts.length){g.fillStyle='#a5b8d2';g.fillText('等待真实记录',40,45);return}let xmax=Math.max(...pts.map(p=>p[0]),1),lo=Math.min(...pts.map(p=>p[1])),hi=Math.max(...pts.map(p=>p[1]));if(hi===lo){hi+=1;lo-=1}g.fillStyle='#a5b8d2';g.font='14px system-ui';g.fillText(hi.toFixed(4),5,20);g.fillText(lo.toFixed(4),5,280);g.fillText('step '+xmax,1090,295);for(let s of series){g.strokeStyle=s.color;g.lineWidth=2;g.beginPath();s.p.forEach((p,i)=>{let x=80+p[0]/xmax*1090,y=270-(p[1]-lo)/(hi-lo)*245;i?g.lineTo(x,y):g.moveTo(x,y)});g.stroke();for(let p of s.p){g.beginPath();g.arc(80+p[0]/xmax*1090,270-(p[1]-lo)/(hi-lo)*245,3,0,7);g.fillStyle=s.color;g.fill()}}}
function render(){if(!state)return;let name=$('arm').value,a=state.arms[name],t=a.training.at(-1),d=a.development.at(-1),valid=a.development.filter(r=>!r.startup),best=valid.length?Math.min(...valid.map(r=>r.station_macro_rmse_mm)):null;let m0=state.arms.M0.selected?.metrics.station_macro_rmse_mm;let bestRecord=valid.find(r=>r.station_macro_rmse_mm===best);let selectedM0=state.arms.M0.selected;let m0screen=state.arms.M0.development.find(r=>r.step===selectedM0?.step)?.station_macro_rmse_mm;let elapsed=0,previous=0;for(let r of a.training){elapsed+=r.seconds>=previous?r.seconds-previous:r.seconds;previous=r.seconds;}
$('status').textContent=state.status?`${state.status.arm} · ${state.status.phase} · step ${state.status.step??'—'} · 最近状态 ${new Date(state.status.updated*1000).toLocaleString()}`:'准备数据与验收中，尚未启动训练';
let rows=[['训练步数',t?.step],['总loss',t?.loss?.toFixed(5)],['均值损失',t?.mean_loss?.toFixed(5)],['方差NLL',t?.nll?.toFixed(5)],['曲率',t?.curvature?.toFixed(5)],['学习率',t?.lr?.toExponential(3)],['步/秒',t?.steps_per_second?.toFixed(3)],['峰值显存MB',t?.gpu_memory_mb?.toFixed(0)],['最新开发RMSE',d?.station_macro_rmse_mm?.toFixed(4)],['MAE / 偏差',d?`${d.mae_mm.toFixed(4)} / ${d.bias_mm.toFixed(4)}`:null],['最佳子集RMSE',best?.toFixed(4)],['最佳对应步数',bestRecord?.step],['最佳子集相对冻结M0（mm）',best!=null&&m0screen!=null?(best-m0screen).toFixed(4):null],['累计已记录时长（小时）',(elapsed/3600).toFixed(2)],['最后训练记录',t?new Date(t.updated*1000).toLocaleString():null]];
$('rawlog').textContent=[...a.training.map(r=>({...r,type:'TRAIN'})),...a.development.map(r=>({...r,type:r.startup?'STARTUP':'DEVELOPMENT'}))].sort((x,y)=>x.updated-y.updated).slice(-20).map(r=>JSON.stringify(r)).join('\n');
$('cards').innerHTML=rows.map(([k,v])=>`<div class="card">${k}<h2>${v??'等待记录'}</h2></div>`).join('');
plot('loss',[['loss','#67baff'],['mean_loss','#6ed6a5'],['nll','#e6be65'],['curvature','#bf9fee']].map(([key,color])=>({color,p:a.training.map(r=>[r.step,r[key]])})));plot('rmse',[{color:'#67baff',p:a.development.map(r=>[r.step,r.station_macro_rmse_mm])}]);
$('full').innerHTML=a.full2019?'<table><tr><th>步数</th><th>RMSE</th><th>MAE</th><th>相对M0</th></tr>'+a.full2019.map(r=>`<tr><td>${r.step}</td><td>${r.metrics.station_macro_rmse_mm.toFixed(4)}</td><td>${r.metrics.mae_mm.toFixed(4)}</td><td>${m0!=null?(r.metrics.station_macro_rmse_mm-m0).toFixed(4):'—'}</td></tr>`).join('')+'</table>':'尚未开展完整2019评价';}
async function refresh(){try{state=await(await fetch('/state')).json();render();$('error').textContent=''}catch(e){$('error').textContent='读取失败，保留上次真实记录：'+e}}$('arm').onchange=render;refresh();setInterval(refresh,5000);
</script>
